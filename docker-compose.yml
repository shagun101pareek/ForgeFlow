services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forgeflow
    ports:
      - "5433:5432"
    volumes:
      - forgeflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forgeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. Start with: docker compose --profile redis up -d
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: forgeflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - forgeflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgeflow_postgres_data:
  forgeflow_redis_data:
