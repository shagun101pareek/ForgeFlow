version: "2"
sql:
  - engine: "postgresql"
    schema: "sql/migrations/*.up.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "db"
        out: "sql/generated"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
